<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 로그인 처리 중...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>구글 로그인을 처리하고 있습니다...</p>
    </div>

    <script>
        // URL에서 authorization code 추출
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        if (error) {
            // 에러가 있는 경우
            window.opener.postMessage({
                type: 'GOOGLE_LOGIN_ERROR',
                error: error
            }, window.location.origin);
            window.close();
        } else if (code) {
            // authorization code가 있는 경우
            // 실제 구현에서는 서버로 code를 전송하여 access token을 받아야 함
            // 여기서는 데모용으로 임시 토큰을 생성
            
            // 서버로 authorization code 전송 (실제 구현 시)
            fetch('http://localhost:5000/auth/google/callback', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ code: code })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 성공 시 부모 창에 메시지 전송
                    window.opener.postMessage({
                        type: 'GOOGLE_LOGIN_SUCCESS',
                        accessToken: data.accessToken,
                        userInfo: data.userInfo
                    }, window.location.origin);
                } else {
                    throw new Error(data.error || '로그인 실패');
                }
            })
            .catch(error => {
                console.error('로그인 처리 중 오류:', error);
                // 에러 발생 시 부모 창에 에러 메시지 전송
                window.opener.postMessage({
                    type: 'GOOGLE_LOGIN_ERROR',
                    error: error.message
                }, window.location.origin);
            })
            .finally(() => {
                // 팝업 창 닫기
                setTimeout(() => {
                    window.close();
                }, 1000);
            });
        } else {
            // code가 없는 경우
            window.opener.postMessage({
                type: 'GOOGLE_LOGIN_ERROR',
                error: 'Authorization code not found'
            }, window.location.origin);
            window.close();
        }
    </script>
</body>
</html>
